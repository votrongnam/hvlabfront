<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Hóa chất - Hùng Vương</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { hv: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' } } } }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-hv-900 text-white shadow-md z-20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center"><i class="fa-solid fa-flask-vial text-xl text-hv-50"></i></div>
                <div>
                    <h1 class="font-bold text-lg uppercase tracking-wide">THCS HÙNG VƯƠNG</h1>
                    <p class="text-xs text-hv-50 font-medium">Hệ thống Quản trị Hóa chất</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-hv-600 px-3 py-1.5 rounded-full font-medium border border-hv-500 hidden sm:block"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Cloud Database</span>
                <div class="w-9 h-9 rounded-full bg-white text-hv-900 flex items-center justify-center font-bold">VN</div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Cột Form -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-fit">
                <h2 class="font-bold text-slate-800 uppercase border-b border-slate-100 pb-4 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-hv-600"></i> Thêm Hóa chất
                </h2>
                <form id="admin-form" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Tên hóa chất *</label>
                        <input type="text" id="c-name" required placeholder="VD: Axit Sunfuric đặc" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-hv-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Công thức *</label>
                            <input type="text" id="c-formula" required placeholder="H2SO4" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-mono outline-none focus:ring-2 focus:ring-hv-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Số CAS</label>
                            <input type="text" id="c-cas" placeholder="7664-93-9" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-mono outline-none focus:ring-2 focus:ring-hv-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Nhà sản xuất</label>
                            <input type="text" id="c-mfg" placeholder="Xilong / Merck" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-hv-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Mức độ an toàn</label>
                            <select id="c-safety" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none cursor-pointer focus:ring-2 focus:ring-hv-500">
                                <option value="safe">🟢 An toàn</option>
                                <option value="warning">🟡 Cảnh báo</option>
                                <option value="danger">🔴 Nguy hiểm</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Điều kiện & Cách bảo quản</label>
                        <input type="text" id="c-storage" placeholder="Nơi khô ráo, tránh ánh sáng..." class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-hv-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Đặc tính vật lý/hóa học</label>
                        <textarea id="c-props" rows="2" placeholder="Chất lỏng sánh..." class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm outline-none resize-none focus:ring-2 focus:ring-hv-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase text-red-500">Sơ cứu khẩn cấp</label>
                        <textarea id="c-firstaid" rows="2" placeholder="Rửa nước sạch liên tục..." class="w-full px-3 py-2 bg-red-50 border border-red-100 rounded-xl text-sm outline-none resize-none focus:ring-2 focus:ring-hv-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-hv-600 hover:bg-hv-700 text-white font-bold py-2.5 rounded-xl shadow-md transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-qrcode"></i> Lưu & Sinh QR Code
                    </button>
                </form>
            </div>

            <!-- Cột Danh sách -->
            <div class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 uppercase"><i class="fa-solid fa-boxes-stacked text-hv-600 mr-2"></i>Kho Hóa chất</h2>
                </div>
                <div class="overflow-x-auto flex-1 p-4">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-slate-500 text-xs uppercase border-b border-slate-200">
                                <th class="pb-3 font-bold px-4">Mã ID</th>
                                <th class="pb-3 font-bold px-4">Hóa chất</th>
                                <th class="pb-3 font-bold px-4">Mức độ</th>
                                <th class="pb-3 font-bold text-right px-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="chem-list" class="text-sm divide-y divide-slate-100">
                            <!-- Dữ liệu load từ API -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal QR Code -->
    <div id="qr-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden text-center relative">
            <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-800 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="bg-hv-600 py-4 text-white"><h3 class="font-bold text-lg">Mã QR Hóa chất</h3></div>
            <div class="p-6">
                <p class="text-xs font-bold text-slate-400 uppercase mb-1">Mã định danh</p>
                <p id="modal-id" class="text-3xl font-mono font-extrabold text-slate-800 mb-4 tracking-widest">ABCDE</p>
                <div class="flex justify-center mb-4"><div id="qrcode-box" class="p-3 border-2 border-slate-200 rounded-xl shadow-sm"></div></div>
                <h4 id="modal-name" class="font-bold text-slate-800 text-lg">Tên Hóa chất</h4>
                <p class="text-xs text-slate-500 mb-6 mt-1">Quét bằng điện thoại để xem chi tiết</p>
                <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 rounded-xl transition">Hoàn tất</button>
            </div>
        </div>
    </div>

    <script>
        function formatFormula(text) {
            if (!text) return '';
            return text.replace(/(\d+)/g, '<sub>$1</sub>');
        }

        async function renderTable() {
            try {
                // Gọi API qua Vercel Rewrites
                const res = await fetch('https://hvlab.onrender.com/api/chemicals');
                const data = await res.json();
                const tbody = document.getElementById('chem-list');
                tbody.innerHTML = '';
                
                data.forEach(chem => {
                    let color = chem.safety === 'danger' ? 'red' : chem.safety === 'warning' ? 'amber' : 'emerald';
                    let safetyText = chem.safety === 'danger' ? 'Nguy hiểm' : chem.safety === 'warning' ? 'Cảnh báo' : 'An toàn';
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 border-b border-slate-100">
                            <td class="py-3 px-4 font-mono font-bold text-slate-600">${chem.id}</td>
                            <td class="py-3 px-4">
                                <p class="font-bold text-slate-800">${chem.name}</p>
                                <p class="text-xs font-mono text-hv-600">${formatFormula(chem.formula)} <span class="text-slate-400">| CAS: ${chem.cas_number || 'N/A'}</span></p>
                            </td>
                            <td class="py-3 px-4"><span class="bg-${color}-100 text-${color}-700 px-2.5 py-1 rounded-md text-xs font-bold">${safetyText}</span></td>
                            <td class="py-3 px-4 text-right space-x-1">
                                <button onclick="showQR('${chem.id}', '${chem.name}')" class="text-hv-600 hover:bg-hv-50 p-2 rounded-lg" title="Xem QR"><i class="fa-solid fa-qrcode"></i></button>
                                <button onclick="deleteChemical('${chem.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded-lg" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error("Lỗi:", e); }
        }

        document.getElementById('admin-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('c-name').value,
                formula: document.getElementById('c-formula').value,
                cas_number: document.getElementById('c-cas').value,
                manufacturer: document.getElementById('c-mfg').value,
                storage: document.getElementById('c-storage').value,
                safety: document.getElementById('c-safety').value,
                properties: document.getElementById('c-props').value,
                firstaid: document.getElementById('c-firstaid').value
            };
            
            try {
                const res = await fetch('/api/chemicals', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                renderTable();
                showQR(result.id, result.name);
                this.reset();
            } catch (e) { alert("Lỗi kết nối Server!"); }
        });

        async function deleteChemical(id) {
            if(!confirm("Bạn có chắc chắn muốn xóa hóa chất này?")) return;
            try {
                const res = await fetch(`https://hvlab.onrender.com/api/chemicals/${id}`, { method: 'DELETE' });
                if(res.ok) renderTable();
                else alert("Xóa thất bại!");
            } catch(e) { alert("Lỗi kết nối khi xóa!"); }
        }

        function showQR(id, name) {
            document.getElementById('modal-id').innerText = id;
            document.getElementById('modal-name').innerText = name;
            document.getElementById('qrcode-box').innerHTML = "";
            const infoUrl = window.location.origin + '/info.html?id=' + id;
            new QRCode(document.getElementById("qrcode-box"), { text: infoUrl, width: 160, height: 160, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
            document.getElementById('qr-modal').classList.remove('hidden');
        }

        renderTable();
    </script>
</body>
</html>
