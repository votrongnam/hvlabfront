<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THCS Hùng Vương - Hệ thống Quản trị Hóa chất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animation mượt cho Popup (Spring Pop-in & Fade-out) */
        .modal-backdrop {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .modal-card {
            transform: scale(0.92) translateY(16px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        }
        .modal-backdrop.active .modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-[#0b5c2c] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2.5 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-flask text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide uppercase leading-tight">THCS HÙNG VƯƠNG</h1>
                    <p class="text-xs text-emerald-100">Hệ thống Quản trị Hóa chất</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="bg-emerald-500/90 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Cloud Database
                </span>
                <div class="w-9 h-9 rounded-full bg-white text-[#0b5c2c] font-bold text-sm flex items-center justify-center shadow">
                    VN
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Cột trái: Form Thêm Hóa Chất -->
        <div class="lg:col-span-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <div class="flex items-center gap-2 pb-4 mb-5 border-b border-slate-100">
                    <i class="fa-solid fa-circle-plus text-emerald-600 text-lg"></i>
                    <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">THÊM HÓA CHẤT</h2>
                </div>

                <form id="chemForm" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">TÊN HÓA CHẤT *</label>
                        <input type="text" id="name" required placeholder="VD: Sulfuric Acid"
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">CÔNG THỨC *</label>
                            <input type="text" id="formula" required placeholder="VD: H2SO4"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SỐ CAS</label>
                            <input type="text" id="cas_number" placeholder="VD: 7664-93-9"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">NHÀ SẢN XUẤT</label>
                            <input type="text" id="manufacturer" placeholder="VD: Xilong Chemical"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">MỨC ĐỘ AN TOÀN</label>
                            <select id="safety"
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                                <option value="Nguy hiểm">🔴 Nguy hiểm</option>
                                <option value="Cảnh báo">🟡 Cảnh báo</option>
                                <option value="An toàn">🟢 An toàn</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐIỀU KIỆN & CÁCH BẢO QUẢN</label>
                        <input type="text" id="storage" placeholder="Nơi khô ráo, thoáng mát, tránh xa các chất dễ cháy..."
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐẶC TÍNH VẬT LÝ/HÓA HỌC</label>
                        <textarea id="properties" rows="2" placeholder="Chất lỏng sánh..."
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"></textarea>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SƠ CỨU KHẨN CẤP</label>
                        <textarea id="firstaid" rows="2" placeholder="Rửa nước sạch liên tục..."
                            class="w-full px-3.5 py-2 rounded-xl border border-red-100 bg-red-50/60 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white transition"></textarea>
                    </div>

                    <div class="pt-1">
                        <label class="flex items-center justify-between text-[11px] font-bold text-[#0b5c2c] uppercase mb-1">
                            <span><i class="fa-solid fa-circle-play mr-1"></i> VIDEO HƯỚNG DẪN SỬ DỤNG</span>
                            <span class="space-x-1.5 text-xs">
                                <i class="fa-brands fa-youtube text-red-500" title="YouTube"></i>
                                <i class="fa-brands fa-facebook text-blue-600" title="Facebook"></i>
                                <i class="fa-brands fa-google-drive text-amber-500" title="Google Drive"></i>
                            </span>
                        </label>
                        <input type="url" id="video_url" placeholder="Dán link YouTube, Facebook hoặc Google Drive..."
                            class="w-full px-3.5 py-2 rounded-xl border border-emerald-200 bg-emerald-50/40 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        <p class="text-[10px] text-slate-400 mt-1">Để trống nếu không có video hướng dẫn.</p>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-[#109c48] hover:bg-[#0d823b] text-white font-semibold py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-qrcode"></i> Lưu & Sinh QR Code
                    </button>
                </form>
            </div>
        </div>

        <!-- Cột phải: Bảng kho hóa chất -->
        <div class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 min-h-[540px]">
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-emerald-600 text-lg"></i>
                        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">KHO HÓA CHẤT</h2>
                    </div>
                    <button onclick="renderTable()" class="text-xs text-slate-500 hover:text-emerald-600 flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-right"></i> Làm mới
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase">
                                <th class="py-3 px-3">MÃ ID</th>
                                <th class="py-3 px-3">HÓA CHẤT</th>
                                <th class="py-3 px-3">MỨC ĐỘ</th>
                                <th class="py-3 px-3 text-right">THAO TÁC</th>
                            </tr>
                        </thead>
                        <tbody id="chemTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu từ máy chủ...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- POPUP CHỈNH SỬA HÓA CHẤT (Có Animation) -->
    <div id="editModal" onclick="if(event.target === this) closeEditModal()" class="modal-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] flex items-center justify-center z-50 p-4">
        <div class="modal-card bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-100 overflow-hidden max-h-[92vh] flex flex-col">
            
            <!-- Header Popup -->
            <div class="bg-[#0b5c2c] text-white px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="bg-white/20 p-2 rounded-lg">
                        <i class="fa-solid fa-pen-to-square text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base uppercase tracking-wider">Chỉnh Sửa Thông Tin Hóa Chất</h3>
                        <p id="editModalIdBadge" class="text-xs text-emerald-100 font-mono">Mã ID: #---</p>
                    </div>
                </div>
                <button type="button" onclick="closeEditModal()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Body Form Popup -->
            <form id="editChemForm" class="p-6 overflow-y-auto space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">TÊN HÓA CHẤT *</label>
                        <input type="text" id="edit_name" required
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">CÔNG THỨC *</label>
                        <input type="text" id="edit_formula" required
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SỐ CAS</label>
                        <input type="text" id="edit_cas_number"
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">NHÀ SẢN XUẤT</label>
                        <input type="text" id="edit_manufacturer"
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">MỨC ĐỘ AN TOÀN</label>
                        <select id="edit_safety"
                            class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                            <option value="Nguy hiểm">🔴 Nguy hiểm</option>
                            <option value="Cảnh báo">🟡 Cảnh báo</option>
                            <option value="An toàn">🟢 An toàn</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐIỀU KIỆN & CÁCH BẢO QUẢN</label>
                    <input type="text" id="edit_storage"
                        class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐẶC TÍNH VẬT LÝ/HÓA HỌC</label>
                        <textarea id="edit_properties" rows="3"
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"></textarea>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SƠ CỨU KHẨN CẤP</label>
                        <textarea id="edit_firstaid" rows="3"
                            class="w-full px-3.5 py-2 rounded-xl border border-red-100 bg-red-50/60 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white transition"></textarea>
                    </div>
                </div>

                <div>
                    <label class="flex items-center justify-between text-[11px] font-bold text-[#0b5c2c] uppercase mb-1">
                        <span><i class="fa-solid fa-circle-play mr-1"></i> LINK VIDEO HƯỚNG DẪN (YOUTUBE, FACEBOOK, GOOGLE DRIVE)</span>
                    </label>
                    <input type="url" id="edit_video_url" placeholder="Dán link YouTube, Facebook hoặc Google Drive..."
                        class="w-full px-3.5 py-2 rounded-xl border border-emerald-200 bg-emerald-50/40 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>

                <!-- Footer Nút bấm -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()"
                        class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition">
                        Hủy
                    </button>
                    <button type="submit" id="saveEditBtn"
                        class="px-6 py-2.5 rounded-xl bg-[#109c48] hover:bg-[#0d823b] text-white font-semibold text-sm shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal hiển thị QR Code (Có Animation đồng bộ) -->
    <div id="qrModal" onclick="if(event.target === this) closeQrModal()" class="modal-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] flex items-center justify-center z-50 p-4">
        <div class="modal-card bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <button onclick="closeQrModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalChemName" class="font-bold text-lg text-slate-800">Tên hóa chất</h3>
            <p id="modalChemFormula" class="text-sm text-emerald-600 font-semibold mb-4">Công thức</p>
            
            <div class="bg-slate-50 p-4 rounded-xl inline-block border border-slate-200 mb-4">
                <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 mx-auto">
            </div>
            
            <p id="modalChemId" class="text-xs text-slate-400 font-mono mb-5"></p>

            <div class="flex gap-3">
                <a id="openInfoLink" href="#" target="_blank"
                    class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở trang
                </a>
                <button onclick="window.print()"
                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-print"></i> In nhãn QR
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://hvlab.onrender.com/api/chemicals";
        let allChemicals = [];
        let editingId = null;

        function getSafetyBadge(safety) {
            if (!safety) return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">Chưa rõ</span>`;
            if (safety.includes("Nguy hiểm")) {
                return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-600 border border-red-200">🔴 Nguy hiểm</span>`;
            }
            if (safety.includes("Cảnh báo")) {
                return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-600 border border-amber-200">🟡 Cảnh báo</span>`;
            }
            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">🟢 An toàn</span>`;
        }

        async function renderTable() {
            const tbody = document.getElementById("chemTableBody");
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                allChemicals = data;

                if (data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-12 text-slate-400">
                                Chưa có hóa chất nào trong kho. Hãy thêm hóa chất mới ở cột bên trái!
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = data.map(chem => `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3.5 px-3 font-mono text-xs font-bold text-slate-500">#${chem.id}</td>
                        <td class="py-3.5 px-3">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800">${chem.name}</span>
                                ${chem.video_url ? `<span class="px-2 py-0.5 rounded-md bg-emerald-100 text-[#0b5c2c] text-[10px] font-bold flex items-center gap-1"><i class="fa-solid fa-play"></i> Video</span>` : ''}
                            </div>
                            <div class="text-xs text-slate-400 font-mono">${chem.formula} ${chem.cas_number ? `• CAS: ${chem.cas_number}` : ''}</div>
                        </td>
                        <td class="py-3.5 px-3">${getSafetyBadge(chem.safety)}</td>
                        <td class="py-3.5 px-3 text-right space-x-1 whitespace-nowrap">
                            <button onclick="showQrModal('${chem.id}', '${chem.name.replace(/'/g, "\\'")}', '${chem.formula.replace(/'/g, "\\'")}')"
                                class="px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition" title="Xem QR">
                                <i class="fa-solid fa-qrcode"></i> QR
                            </button>
                            <button onclick="openEditModal('${chem.id}')"
                                class="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 text-xs font-semibold transition" title="Chỉnh sửa hóa chất">
                                <i class="fa-solid fa-pen-to-square"></i> Sửa
                            </button>
                            <a href="info.html?id=${chem.id}" target="_blank"
                                class="inline-block px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs font-semibold transition" title="Xem chi tiết">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <button onclick="deleteChemical('${chem.id}')"
                                class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 text-xs font-semibold transition" title="Xóa">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                console.error("Lỗi:", err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-10 text-red-500 text-sm">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Không thể kết nối tới API (${API_URL}).
                        </td>
                    </tr>`;
            }
        }

        // Mở Popup Chỉnh sửa với hiệu ứng mượt
        function openEditModal(id) {
            const chem = allChemicals.find(c => c.id === id);
            if (!chem) return;

            editingId = id;
            document.getElementById("editModalIdBadge").textContent = `Mã ID: #${id} (Giữ nguyên mã QR)`;

            document.getElementById("edit_name").value = chem.name || "";
            document.getElementById("edit_formula").value = chem.formula || "";
            document.getElementById("edit_cas_number").value = (chem.cas_number && chem.cas_number !== "Không có") ? chem.cas_number : "";
            document.getElementById("edit_manufacturer").value = (chem.manufacturer && chem.manufacturer !== "Không có") ? chem.manufacturer : "";
            
            if (chem.safety && chem.safety.includes("Cảnh báo")) {
                document.getElementById("edit_safety").value = "Cảnh báo";
            } else if (chem.safety && chem.safety.includes("An toàn")) {
                document.getElementById("edit_safety").value = "An toàn";
            } else {
                document.getElementById("edit_safety").value = "Nguy hiểm";
            }

            document.getElementById("edit_storage").value = chem.storage || "";
            document.getElementById("edit_properties").value = chem.properties || "";
            document.getElementById("edit_firstaid").value = chem.firstaid || "";
            document.getElementById("edit_video_url").value = chem.video_url || "";

            document.getElementById("editModal").classList.add("active");
        }

        // Đóng Popup Chỉnh sửa với hiệu ứng thu nhỏ
        function closeEditModal() {
            editingId = null;
            document.getElementById("editModal").classList.remove("active");
        }

        // Xử lý lưu trong Popup Chỉnh sửa (PUT)
        document.getElementById("editChemForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!editingId) return;

            const btn = document.getElementById("saveEditBtn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`;

            const payload = {
                name: document.getElementById("edit_name").value.trim(),
                formula: document.getElementById("edit_formula").value.trim(),
                cas_number: document.getElementById("edit_cas_number").value.trim() || "Không có",
                manufacturer: document.getElementById("edit_manufacturer").value.trim() || "Không có",
                safety: document.getElementById("edit_safety").value,
                storage: document.getElementById("edit_storage").value.trim() || "Bảo quản nơi khô ráo, thoáng mát",
                properties: document.getElementById("edit_properties").value.trim() || "Chưa cập nhật",
                firstaid: document.getElementById("edit_firstaid").value.trim() || "Đưa đến cơ sở y tế gần nhất",
                video_url: document.getElementById("edit_video_url").value.trim()
            };

            try {
                const res = await fetch(`${API_URL}/${editingId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Cập nhật thất bại");

                closeEditModal();
                await renderTable();
            } catch (err) {
                alert("Lỗi khi cập nhật! Hãy kiểm tra xem main.py đã thêm hàm PUT chưa.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi`;
            }
        });

        // Xử lý thêm hóa chất mới ở cột trái (POST)
        document.getElementById("chemForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`;

            const payload = {
                name: document.getElementById("name").value.trim(),
                formula: document.getElementById("formula").value.trim(),
                cas_number: document.getElementById("cas_number").value.trim() || "Không có",
                manufacturer: document.getElementById("manufacturer").value.trim() || "Không có",
                safety: document.getElementById("safety").value,
                storage: document.getElementById("storage").value.trim() || "Bảo quản nơi khô ráo, thoáng mát",
                properties: document.getElementById("properties").value.trim() || "Chưa cập nhật",
                firstaid: document.getElementById("firstaid").value.trim() || "Đưa đến cơ sở y tế gần nhất",
                video_url: document.getElementById("video_url").value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Lưu thất bại");
                const result = await res.json();

                document.getElementById("chemForm").reset();
                await renderTable();
                showQrModal(result.id, payload.name, payload.formula);
            } catch (err) {
                alert("Lỗi khi lưu hóa chất! Hãy kiểm tra lại kết nối Backend.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Lưu & Sinh QR Code`;
            }
        });

        async function deleteChemical(id) {
            if (!confirm(`Bạn có chắc muốn xóa hóa chất mã #${id} không?`)) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                if (res.ok) renderTable();
            } catch (err) {
                alert("Không thể xóa hóa chất!");
            }
        }

        function showQrModal(id, name, formula) {
            const infoUrl = `${window.location.origin}/info.html?id=${id}`;
            document.getElementById("modalChemName").textContent = name;
            document.getElementById("modalChemFormula").textContent = formula;
            document.getElementById("modalChemId").textContent = `ID: #${id}`;
            document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(infoUrl)}`;
            document.getElementById("openInfoLink").href = `info.html?id=${id}`;
            
            document.getElementById("qrModal").classList.add("active");
        }

        function closeQrModal() {
            document.getElementById("qrModal").classList.remove("active");
        }

        // Hỗ trợ nhấn phím ESC để đóng mượt cả 2 Popup
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeEditModal();
                closeQrModal();
            }
        });

        renderTable();
    </script>
</body>
</html>
