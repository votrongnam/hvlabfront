<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THCS Hùng Vương - Hệ thống Quản trị Hóa chất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-[#0b5c2c] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2.5 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-flask text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide uppercase leading-tight">THCS HÙNG VƯƠNG</h1>
                    <p class="text-xs text-emerald-100">Hệ thống Quản trị Hóa chất</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="dbStatus" class="bg-emerald-500/90 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Cloud Database
                </span>
                <div class="w-9 h-9 rounded-full bg-white text-[#0b5c2c] font-bold text-sm flex items-center justify-center shadow">
                    VN
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Cột trái: Form thêm hóa chất -->
        <div class="lg:col-span-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <div class="flex items-center gap-2 pb-4 mb-5 border-b border-slate-100">
                    <i class="fa-solid fa-circle-plus text-emerald-600 text-lg"></i>
                    <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">THÊM HÓA CHẤT</h2>
                </div>

                <form id="chemForm" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">TÊN HÓA CHẤT *</label>
                        <input type="text" id="name" required placeholder="VD: Sulfuric Acid"
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">CÔNG THỨC *</label>
                            <input type="text" id="formula" required placeholder="VD: H2SO4"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SỐ CAS</label>
                            <input type="text" id="cas_number" placeholder="VD: 7664-93-9"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">NHÀ SẢN XUẤT</label>
                            <input type="text" id="manufacturer" placeholder="VD: Xilong Chemical"
                                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">MỨC ĐỘ AN TOÀN</label>
                            <select id="safety"
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                                <option value="Nguy hiểm">🔴 Nguy hiểm</option>
                                <option value="Cảnh báo">🟡 Cảnh báo</option>
                                <option value="An toàn">🟢 An toàn</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐIỀU KIỆN & CÁCH BẢO QUẢN</label>
                        <input type="text" id="storage" placeholder="Nơi khô ráo, thoáng mát, tránh xa nguồn nhiệt..."
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">ĐẶC TÍNH VẬT LÝ/HÓA HỌC</label>
                        <textarea id="properties" rows="2" placeholder="Chất lỏng sánh, không màu, hút ẩm mạnh..."
                            class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"></textarea>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">SƠ CỨU KHẨN CẤP</label>
                        <textarea id="firstaid" rows="2" placeholder="Rửa nước sạch liên tục ít nhất 15 phút..."
                            class="w-full px-3.5 py-2 rounded-xl border border-red-100 bg-red-50/60 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:bg-white transition"></textarea>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-[#109c48] hover:bg-[#0d823b] text-white font-semibold py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-qrcode"></i> Lưu & Sinh QR Code
                    </button>
                </form>
            </div>
        </div>

        <!-- Cột phải: Bảng kho hóa chất -->
        <div class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 min-h-[540px]">
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-emerald-600 text-lg"></i>
                        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-wider">KHO HÓA CHẤT</h2>
                    </div>
                    <button onclick="renderTable()" class="text-xs text-slate-500 hover:text-emerald-600 flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-right"></i> Làm mới
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase">
                                <th class="py-3 px-3">MÃ ID</th>
                                <th class="py-3 px-3">HÓA CHẤT</th>
                                <th class="py-3 px-3">MỨC ĐỘ</th>
                                <th class="py-3 px-3 text-right">THAO TÁC</th>
                            </tr>
                        </thead>
                        <tbody id="chemTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu từ máy chủ...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal hiển thị QR Code -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl relative">
            <button onclick="closeQrModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalChemName" class="font-bold text-lg text-slate-800">Tên hóa chất</h3>
            <p id="modalChemFormula" class="text-sm text-emerald-600 font-semibold mb-4">Công thức</p>
            
            <div class="bg-slate-50 p-4 rounded-xl inline-block border border-slate-200 mb-4">
                <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 mx-auto">
            </div>
            
            <p id="modalChemId" class="text-xs text-slate-400 font-mono mb-5"></p>

            <div class="flex gap-3">
                <a id="openInfoLink" href="#" target="_blank"
                    class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở trang
                </a>
                <button onclick="window.print()"
                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-print"></i> In nhãn QR
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://hvlab.onrender.com/api/chemicals";

        function getSafetyBadge(safety) {
            if (!safety) return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">Chưa rõ</span>`;
            if (safety.includes("Nguy hiểm")) {
                return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-600 border border-red-200">🔴 Nguy hiểm</span>`;
            }
            if (safety.includes("Cảnh báo")) {
                return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-600 border border-amber-200">🟡 Cảnh báo</span>`;
            }
            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200">🟢 An toàn</span>`;
        }

        async function renderTable() {
            const tbody = document.getElementById("chemTableBody");
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-12 text-slate-400">
                                Chưa có hóa chất nào trong kho. Hãy thêm hóa chất mới ở cột bên trái!
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = data.map(chem => `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3.5 px-3 font-mono text-xs font-bold text-slate-500">#${chem.id}</td>
                        <td class="py-3.5 px-3">
                            <div class="font-bold text-slate-800">${chem.name}</div>
                            <div class="text-xs text-slate-400 font-mono">${chem.formula} ${chem.cas_number ? `• CAS: ${chem.cas_number}` : ''}</div>
                        </td>
                        <td class="py-3.5 px-3">${getSafetyBadge(chem.safety)}</td>
                        <td class="py-3.5 px-3 text-right space-x-1.5">
                            <button onclick="showQrModal('${chem.id}', '${chem.name.replace(/'/g, "\\'")}', '${chem.formula.replace(/'/g, "\\'")}')"
                                class="px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition" title="Xem QR">
                                <i class="fa-solid fa-qrcode"></i> QR
                            </button>
                            <a href="info.html?id=${chem.id}" target="_blank"
                                class="inline-block px-2.5 py-1.5 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs font-semibold transition" title="Xem chi tiết">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                            <button onclick="deleteChemical('${chem.id}')"
                                class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 text-xs font-semibold transition" title="Xóa">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                console.error("Lỗi:", err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-10 text-red-500 text-sm">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Không thể kết nối tới API (${API_URL}).<br>
                            <span class="text-xs text-slate-400">Hãy kiểm tra xem Render Backend đã chạy xong chưa hoặc MongoDB đã mở IP 0.0.0.0/0 chưa.</span>
                        </td>
                    </tr>`;
            }
        }

        document.getElementById("chemForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...`;

            const payload = {
                name: document.getElementById("name").value.trim(),
                formula: document.getElementById("formula").value.trim(),
                cas_number: document.getElementById("cas_number").value.trim() || "Không có",
                manufacturer: document.getElementById("manufacturer").value.trim() || "Không có",
                safety: document.getElementById("safety").value,
                storage: document.getElementById("storage").value.trim() || "Bảo quản nơi khô ráo, thoáng mát",
                properties: document.getElementById("properties").value.trim() || "Chưa cập nhật",
                firstaid: document.getElementById("firstaid").value.trim() || "Đưa đến cơ sở y tế gần nhất"
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Lưu thất bại");
                const result = await res.json();

                document.getElementById("chemForm").reset();
                await renderTable();
                showQrModal(result.id, payload.name, payload.formula);
            } catch (err) {
                alert("Lỗi khi lưu hóa chất! Hãy kiểm tra lại kết nối Backend.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Lưu & Sinh QR Code`;
            }
        });

        async function deleteChemical(id) {
            if (!confirm(`Bạn có chắc muốn xóa hóa chất mã #${id} không?`)) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                if (res.ok) renderTable();
            } catch (err) {
                alert("Không thể xóa hóa chất!");
            }
        }

        function showQrModal(id, name, formula) {
            const infoUrl = `${window.location.origin}/info.html?id=${id}`;
            document.getElementById("modalChemName").textContent = name;
            document.getElementById("modalChemFormula").textContent = formula;
            document.getElementById("modalChemId").textContent = `ID: #${id}`;
            document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(infoUrl)}`;
            document.getElementById("openInfoLink").href = `info.html?id=${id}`;
            
            const modal = document.getElementById("qrModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeQrModal() {
            const modal = document.getElementById("qrModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        renderTable();
    </script>
</body>
</html>
